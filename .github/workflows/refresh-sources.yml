name: Refresh market sources

# 补发 npm 之后运行一次：把索引里仍是 git 来源、但 npm 上已经存在的版本改成 npm 来源，
# 重新生成并校验 market/index.json，提交后重新部署 Pages。

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Switch published versions to the npm source
        run: |
          node scripts/refresh-sources.mjs
          node scripts/build-market.mjs
      - name: Commit the refreshed index
        id: commit
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add market/releases.json market/index.json
          if git diff --cached --quiet; then
            echo "索引没有变化"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore(market): refresh released sources from npm"
          git push origin main
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Redeploy Pages
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run pages.yml --ref main
