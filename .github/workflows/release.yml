name: Release

# 发布一个插件版本：tag 名 = <插件目录名>-v<version>，例如 vt-quote-bar-v1.0.0。
# 依次做：校验 tag 与 package.json 一致 → 用 npm Trusted Publishing（OIDC）发布到 npm
# → 打包 .tgz 挂 GitHub Release → 记账并重新生成 market/index.json（官方校验器把关）
# → 提交到 main → 重新部署 Pages。
#
# npm 发布走 OIDC：不需要任何 token，也不需要 npm 登录。前提是 npmjs.com 上该包已配置
# Trusted Publisher（组织/用户 Vontean、仓库 vt-dsh-plugin、workflow release.yml、允许 publish）。
# 未配置时 publish 步骤失败但工作流继续，市场索引退回 commit 固定的 git 来源，之后再补发布即可。

on:
  push:
    tags:
      - "*-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "要（重新）发布的 tag，例如 vt-quote-bar-v1.0.0"
        required: true

permissions:
  contents: write
  actions: write
  id-token: write # OIDC：npm Trusted Publishing 用它换取一次性发布凭证

concurrency:
  group: release
  cancel-in-progress: false

env:
  TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0

      - name: Read plugin and version from the tag
        id: tag
        run: |
          set -euo pipefail
          tag="$TAG"
          version="${tag##*-v}"
          slug="${tag%-v*}"
          dir="plugins/$slug"
          test -f "$dir/package.json" || { echo "tag $tag 不对应任何插件目录 ($dir)"; exit 1; }
          name=$(node -p "require('./$dir/package.json').name")
          manifest_version=$(node -p "require('./$dir/package.json').version")
          test "$manifest_version" = "$version" || { echo "$dir/package.json 是 $manifest_version，tag 却是 $version"; exit 1; }
          {
            echo "slug=$slug"
            echo "dir=$dir"
            echo "name=$name"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"
          echo "发布 $name@$version（目录 $dir）"

      - name: Refuse a tag that is not on main
        run: |
          set -euo pipefail
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main || { echo "tag 提交不在 main 上，拒绝发布"; exit 1; }

      - name: Work from the latest main
        # 多个版本的发布可能排队执行；市场账本必须基于 main 的最新副本，
        # 否则每个 tag 都会用它自己树里的旧账本覆盖别人刚记下的版本。
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          dir='${{ steps.tag.outputs.dir }}'
          version='${{ steps.tag.outputs.version }}'
          current=$(node -p "require('./$dir/package.json').version")
          test "$current" = "$version" || { echo "main 上 $dir 的版本是 $current，不是 tag 的 $version，拒绝重放旧 tag"; exit 1; }

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Trusted Publishing 需要 npm >= 11.5.1，Node 22 自带的 npm 版本通常更低。
      - name: Install an npm that supports trusted publishing
        run: npm install --global npm@11.19.0
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Publish to npm with OIDC trusted publishing
        id: npm
        continue-on-error: true
        run: |
          set -euo pipefail
          name='${{ steps.tag.outputs.name }}'
          version='${{ steps.tag.outputs.version }}'
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version 已存在于 npm，跳过"
            exit 0
          fi
          cd '${{ steps.tag.outputs.dir }}'
          npm publish --access public

      - name: Record the release and regenerate the market index
        run: |
          set -euo pipefail
          name='${{ steps.tag.outputs.name }}'
          version='${{ steps.tag.outputs.version }}'
          commit=$(git rev-parse HEAD)
          if npm view "$name@$version" version >/dev/null 2>&1; then
            kind=npm
            sha=''
            echo "npm 上已有 $name@$version，索引来源记为 npm"
          else
            kind=git
            sha="$commit"
            echo "npm 上没有 $name@$version，索引来源记为 commit $commit 的 git 子树"
          fi
          node scripts/record-release.mjs "$name" "$version" "$kind" "$sha"
          node scripts/build-market.mjs

      - name: Pack the tarball
        run: |
          set -euo pipefail
          mkdir -p release
          cd '${{ steps.tag.outputs.dir }}'
          pnpm pack --pack-destination "$GITHUB_WORKSPACE/release"
          ls -l "$GITHUB_WORKSPACE/release"

      - name: Create or update the GitHub Release with the tarball
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          name='${{ steps.tag.outputs.name }}'
          version='${{ steps.tag.outputs.version }}'
          slug='${{ steps.tag.outputs.slug }}'
          notes=$(mktemp)
          cat > "$notes" <<EOF
          \`$name\` $version — 由总集仓库 [vt-dsh-plugin](https://github.com/Vontean/vt-dsh-plugin) 发布。

          ## 安装

          插件市场（推荐）：在「插件 → 发现 → 添加索引源」里填入
          \`https://vontean.github.io/vt-dsh-plugin/index.json\`，找到本插件点安装。

          npm：\`dsh plugin --profile <profile> add $name@$version\`

          Release tarball：\`dsh plugin --profile <profile> add <本页附件 .tgz 的路径或 URL>\`

          ## 说明

          - 运行环境：DSH \`>=0.2.1-rc.5 <0.3.0\`（超范围会在加载前被拒绝）。
          - 插件代码在用户进程内运行，没有沙箱；只安装你信任的来源。
          - 市场里的「更新」是卸载再安装；升级前请自行确认配置是否需要迁移。
          - 安装或升级后需要**重启 dsh**，刷新页面不生效。
          EOF
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release/*.tgz --clobber
            gh release edit "$TAG" --title "$name $version" --notes-file "$notes"
          else
            gh release create "$TAG" release/*.tgz --title "$name $version" --notes-file "$notes"
          fi

      - name: Commit the market index
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add market/releases.json market/index.json
          if git diff --cached --quiet; then
            echo "market 索引没有变化，跳过提交"
            exit 0
          fi
          git commit -m "chore(market): record ${{ steps.tag.outputs.name }}@${{ steps.tag.outputs.version }}"
          # 并发发布由 concurrency 组串行化，这里只兜底一次冲突。
          git push origin HEAD:main || {
            echo "推送 main 失败（可能有并发提交），请用 workflow_dispatch 重跑 tag=$TAG"
            exit 1
          }

      - name: Redeploy Pages from main
        # github-pages 环境只允许从分支部署，tag 触发的运行会被环境策略拒绝，
        # 所以这里对 main 触发 pages 工作流，由它在 main 上完成部署。
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run pages.yml --ref main
