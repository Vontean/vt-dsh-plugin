name: Deploy market index

# main 上的索引变动（或手动触发）就重新部署 GitHub Pages。
# release 工作流里也有一份部署 job：Actions 用 GITHUB_TOKEN 提交的 push 不会触发本工作流。

on:
  push:
    branches:
      - main
    paths:
      - "market/index.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stage the index
        run: |
          mkdir -p _site
          cp market/index.json _site/index.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
