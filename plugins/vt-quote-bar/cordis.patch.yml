# dsh-vt-quote-bar — 把插件挂进 DSH 配置树。
#
# Host 半侧（index.js）注册 /vt-quote-bar/api/* 路由，读取账号余额和上游额度；
# Client 半侧（client.js）在侧边栏 footer 注册额度条。
#
# 通过 plugin_manager 的 install_bundle 安装时，工具会自己写 profile 的
# package.json 与 bundle 列表，不需要手工编辑本文件之外的任何配置。
- insert:
    - id: vt-quote-bar
      name: 'dsh-vt-quote-bar'
