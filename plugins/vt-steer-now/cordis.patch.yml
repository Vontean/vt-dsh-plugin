# dsh-vt-steer-now — 把插件挂进 DSH 配置树。
#
# 本插件由两部分组成：
#   · Host 半侧（index.js）：注册 /vt-steer-now/api/* 路由，把「立即发送」翻译成
#     Agent 层的原子操作（移出队列 → 中断当前回合 → 重新投递并唤醒）；
#   · Client 半侧（client.js）：在待生效的插入气泡下方注入「立即发送」动作。
#
# 通过 plugin_manager 的 install_bundle 安装时，工具会自己写 profile 的
# package.json 与 bundle 列表，不需要手工编辑本文件之外的任何配置。
- insert:
    - id: vt-steer-now
      name: 'dsh-vt-steer-now'
