<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>dsh-vt-gen-ui · 结构规则探针</title>
<!-- 设计意图层（§12.6）：手写 .pr-* 静态页，不经过渲染器，照着
     docs/specs/prototype-visual-rules.md §12.3 / §12.4 画。
     它表达「规则应该长什么样」；与 verify-structures.html（真实 spec 走 runtime、
     表达「实现现在长什么样」）出现分歧时，按 §12.6 判定，不要为了对齐而改这里。 -->
<link rel="stylesheet" href="./theme.css" />
<link rel="stylesheet" href="../../src/client/GenuiBlock.module.css" />
<link rel="stylesheet" href="./prototype.css" />
<style>
/* 结构规则专用（§12.3.1 / §12.4）。pageBody 的 gutter、gap、贴边抵消与
   首末外边距抑制都在 prototype.css，这里只写本页独有的结构规则。 */
.pr-text { margin: 0; font-size: 14px; line-height: 20px; color: var(--dsw-alias-label-primary); }

/* ── 规则 B：只有屏幕画虚线，嵌套区域是实线（§12.4） ── */
.pr-page--nested { border-style: solid; }
.pr-frame--nested { margin-top: 0; }
.pr-split--demo { margin: 0; }
/* 页面级 empty/loading 的兜底 padding 归零，避免与 pageBody 相加（24+24=48） */
.pr-page-body > .pr-empty,
.pr-page-body > .pr-loading { padding: 0; }
</style>
</head>
<body>
<div class="block pr-probe">
  <h1>结构规则探针</h1>
  <p class="lead">验证两条规则：一屏只有一个左边缘（§12.3）；角标属于屏幕、虚线只有一层（§12.4）。</p>
  <!-- 屏 8：内容列对齐 + 嵌套区域 -->
  <div class="pr-frame">
    <span class="pr-frame-label">屏 8 · 内容列与嵌套区域</span>
    <div class="pr-page">
      <header class="pr-header">
        <div class="pr-header__text">
          <h2 class="pr-title">我的一天</h2>
          <p class="pr-sub">标题、直排 text、字段标签必须共用一条左边缘</p>
        </div>
      </header>
      <div class="pr-page-body" data-page-body="">
        <p class="pr-text">直排 text 不再贴外框：左右缩进只由页面内容列提供，组件不各自决定。</p>
        <div class="pr-field">
          <label class="pr-field__label">截止时间</label>
          <div class="pr-field__input pr-field__input--placeholder">选择日期</div>
        </div>
        <div class="pr-rows" data-bleed="inline">
          <div class="pr-row">
            <span class="pr-row__media"><svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true"><path fill-rule="evenodd" d="M11.568 3.5a1 1 0 0 0-.863.494l-.811 1.381A3.001 3.001 0 0 1 7.33 6.856l-1.596.013a1 1 0 0 0-.858.501l-.439.761a1 1 0 0 0-.004.992l.792 1.4a3 3 0 0 1 0 2.954l-.792 1.4a1 1 0 0 0 .004.992l.439.76a1 1 0 0 0 .858.502l1.596.013a3 3 0 0 1 2.564 1.48l.811 1.382a1 1 0 0 0 .863.494h.87a1 1 0 0 0 .862-.494l.812-1.381a3.001 3.001 0 0 1 2.563-1.481l1.596-.013a1 1 0 0 0 .86-.501l.438-.761a1 1 0 0 0 .004-.992l-.793-1.4a3 3 0 0 1 0-2.954l.793-1.4a1 1 0 0 0-.004-.992l-.439-.76a1 1 0 0 0-.858-.502l-1.597-.013a3 3 0 0 1-2.563-1.48L13.3 3.993a1 1 0 0 0-.862-.494h-.87ZM8.98 2.981A3.001 3.001 0 0 1 11.568 1.5h.87c1.064 0 2.049.564 2.588 1.481l.811 1.382a1 1 0 0 0 .855.494l1.596.013a3 3 0 0 1 2.575 1.502l.44.76a3 3 0 0 1 .011 2.975l-.792 1.4a1 1 0 0 0 0 .985l.792 1.401a3 3 0 0 1-.012 2.974l-.439.761a3.001 3.001 0 0 1-2.575 1.503l-1.597.012a1 1 0 0 0-.854.494l-.811 1.382a3.001 3.001 0 0 1-2.588 1.481h-.87a3.001 3.001 0 0 1-2.588-1.481l-.811-1.382a1 1 0 0 0-.855-.494l-1.596-.012a3.001 3.001 0 0 1-2.576-1.503l-.438-.76a3 3 0 0 1-.013-2.975l.793-1.4a1 1 0 0 0 0-.985l-.793-1.4a3 3 0 0 1 .013-2.975l.438-.761A3.001 3.001 0 0 1 5.718 4.87l1.596-.013a1 1 0 0 0 .855-.494l.81-1.382Z" clip-rule="evenodd"/><path fill-rule="evenodd" d="M12.003 10.5a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3ZM8.502 12a3.5 3.5 0 1 1 7 .001 3.5 3.5 0 0 1-7-.001Z" clip-rule="evenodd"/></svg></span>
            <span class="pr-row__body">
              <span class="pr-row__title">行是贴边型：hover 底与分隔线铺满整宽</span>
              <span class="pr-row__desc">内容仍对齐 24，靠负外边距把盒子拉回外框</span>
            </span>
          </div>
        </div>
        <div class="pr-split pr-split--demo">
          <div class="pr-frame pr-frame--nested">
            <span class="pr-frame-label">方案 A</span>
            <div class="pr-page pr-page--nested">
              <div class="pr-page-body" data-page-body="">
                <div class="pr-empty">
                  <div class="pr-empty__graphic"></div>
                  <div class="pr-empty__title">还没有内容</div>
                </div>
              </div>
            </div>
          </div>
          <div class="pr-frame pr-frame--nested">
            <span class="pr-frame-label">方案 B</span>
            <div class="pr-page pr-page--nested">
              <div class="pr-page-body" data-page-body="">
                <div class="pr-rows" data-bleed="inline">
                  <div class="pr-row" style="min-height: 40px;">
                    <span class="pr-row__media" style="width: 32px; height: 32px;"><svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true"><path fill-rule="evenodd" clip-rule="evenodd" d="M10.5555 4C10.099 4 9.70052 4.30906 9.58693 4.75114L9.29382 5.8919H14.715L14.4219 4.75114C14.3083 4.30906 13.9098 4 13.4533 4H10.5555ZM16.7799 5.8919L16.3589 4.25342C16.0182 2.92719 14.8226 2 13.4533 2H10.5555C9.18616 2 7.99062 2.92719 7.64985 4.25342L7.22886 5.8919H4C3.44772 5.8919 3 6.33961 3 6.8919C3 7.44418 3.44772 7.8919 4 7.8919H4.10069L5.31544 19.3172C5.47763 20.8427 6.76455 22 8.29863 22H15.7014C17.2354 22 18.5224 20.8427 18.6846 19.3172L19.8993 7.8919H20C20.5523 7.8919 21 7.44418 21 6.8919C21 6.33961 20.5523 5.8919 20 5.8919H16.7799ZM17.888 7.8919H6.11196L7.30423 19.1057C7.3583 19.6142 7.78727 20 8.29863 20H15.7014C16.2127 20 16.6417 19.6142 16.6958 19.1057L17.888 7.8919ZM10 10C10.5523 10 11 10.4477 11 11V16C11 16.5523 10.5523 17 10 17C9.44772 17 9 16.5523 9 16V11C9 10.4477 9.44772 10 10 10ZM14 10C14.5523 10 15 10.4477 15 11V16C15 16.5523 14.5523 17 14 17C13.4477 17 13 16.5523 13 16V11C13 10.4477 13.4477 10 14 10Z"/></svg></span>
                    <span class="pr-row__body"><span class="pr-row__title">嵌套区域用实线</span></span>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

</div>
<script>
  const params = new URLSearchParams(location.search);
  document.body.setAttribute('data-theme', params.get('theme') === 'dark' ? 'dark' : 'light');
  if (params.get('theme') === 'dark') document.body.setAttribute('data-ds-dark-theme', '');
  const w = Number(params.get('w'));
  if (w > 0) document.querySelector('.pr-probe').style.maxWidth = w + 'px';
</script>
</body>
</html>
